    .sidebar-title {
      color: var(--fg-color) !important;
      font-family: var(--primary-text-typeface), var(--secondary-special-typeface), serif !important;
      font-size: 1.3em;
      font-style: none;
      letter-spacing: 0vw;
      text-transform: none;
    }

    .sidebar-item p {
      color: var(--demure-color) !important;
    }

    .sidebar a, .sidebar a.active {
      color: var(--fg-color) !important;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: var(--theme-color); 
      transition: 0.1s;
    }

    .sidebar a:hover, .sidebar a.active:hover {
      color: var(--theme-color) !important;
      text-decoration: underline;
      text-decoration-color: var(--fg-color); 
      transition: 0.1s;
    }

    #sidebar-checkbox:checked~.sidebar, #sidebar-checkbox:checked~.wrap,
    #sidebar-checkbox:checked~.sidebar-toggle {
      transform: translateX(75vw);
    }

    .wrap, .sidebar-toggle {
      transition: all 0.5s ease-in-out;
    }

    @media (min-width: 768px) {
      .sidebar {
        width: 40%;

      }

      #sidebar-checkbox:checked~.sidebar, #sidebar-checkbox:checked~.wrap,
      #sidebar-checkbox:checked~.sidebar-toggle {
        transform: translateX(40vw);
      }

      .wrap, .sidebar-toggle {
        transition: all 0.5s ease-in-out;
      }
    }

    .sidebar-toggle {
      top: 1.5rem;
      padding: 0.65em 0pt 0pt 0em;
      background-color: var(--bg-color);
      color: var(--theme-color);
    }

    .sidebar-toggle:before {
      display: inline-block;
      width: 1em;
      height: 0;
      content: "»";
      text-align: center;
      font-size: 3em;
      line-height: 0;
      background-image: none;
      color: var(--theme-color);
      background-color: var(--bg-color) !important;
    }

    #sidebar-checkbox:focus~.sidebar-toggle:before, #sidebar-checkbox:checked~.sidebar-toggle:before {
      content: "«";
      background-image: none;
      color: var(--bg-color) !important;
    }
    .sidebar-toggle:active, #sidebar-checkbox:focus~.sidebar-toggle,
    #sidebar-checkbox:checked~.sidebar-toggle {
      background-color: var(--theme-color) !important;
    }

      -moz-transition: all .15s ease-in-out;
      -ms-transition: all .15s ease-in-out;
      -o-transition: all .15s ease-in-out;

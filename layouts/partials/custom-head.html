<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://smc.org.in/fonts/malini.css');
  @import url('https://fonts.googleapis.com/css2?family=Baskervville+SC:wght@400..700&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Cutive+Mono&family=Gelasio:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Marcellus+SC&family=Noto+Sans+Symbols+2&family=Playfair+Display+SC:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');

  :lang(ml) {
    font-family: "Malini";
    unicode-range: U+0D00-0D7F;
    font-display: swap;
    font-stretch: expanded;
  }



  html, body, .wrap, main {
    -webkit-overflow-scrolling: touch !important;
    /* Forces fluid iOS momentum scrolling */
    scroll-behavior: smooth;
    touch-action: manipulation !important;
  }

  body.sidebar-open {
    position: fixed;
    overflow: hidden;
  }

  @media (max-width: 768px) {
    html, body {
      height: auto !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      position: relative !important;
    }

    .wrap {
      height: auto !important;
      min-height: 100vh !important;
      overflow: visible !important;
      position: relative !important;
    }
    
    main {
      overflow: visible !important;
    }
  }



  html {
    --fg-color: #2b2b2b;
    --bg-color: #f8f5db;
    --theme-color: #87583c;
    --comp-color: #f5e6cc;
    --masthead-color: var(--bg-color);
    --demure-color: #807050;
		--bg-faint: #f0ecd3;
  }

	/* arabesque pattern */
	body {
		--s: 40px; /* control the size*/
		--c1: var(--bg-faint);
		--c2: var(--bg-color);
		
		--t: 2px; /* calc(var(--s)/18);  /* control the thickness */
		--_c: #0000 calc(98% - var(--t)),var(--c1) calc(100% - var(--t)) 98%,#0000;
		--_s: calc(2*var(--s)) calc(5*var(--s)/2);
		--_r0: /var(--_s) radial-gradient(calc(var(--s)/2) at 0.5px    20%,var(--_c));
		--_r1: /var(--_s) radial-gradient(calc(var(--s)/2) at calc(100% - 0.5px) 20%,var(--_c));

		background:
			0 0 var(--_r0),calc(-1*var(--s)) calc(5*var(--s)/4) var(--_r0),
			var(--s) 0 var(--_r1),0 calc(5*var(--s)/4) var(--_r1),
			conic-gradient(at var(--t) calc(20% + 2*var(--t)),#0000 75%,var(--c1) 0)
			calc(var(--t)/-2) calc(var(--s) - var(--t))/var(--s) calc(5*var(--s)/4),
			repeating-conic-gradient(var(--c2) 0 25%,#0000 0 50%)
			var(--s) calc(var(--s)/-8)/var(--_s),
			conic-gradient(from 90deg at var(--t) var(--t),var(--c2) 25%,var(--c1) 0) 
			calc((var(--s) - var(--t))/2) calc((var(--s) - var(--t))/2)/var(--s) calc(5*var(--s)/4);

		image-rendering: -webkit-optimize-contrast;
		image-rendering: crisp-edges;
	}

  body {
    background-color: var(--bg-color);
    color: var(--fg-color);
    font-family: "Gelasio", "Georgia", serif;
  }

  html, body {
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  h1, h2, h3, h4, h5, h6 {
    color: #111111;
    font-family: "Marcellus SC", "Bodoni 72", serif;
    font-weight: 400;
    font-size: 1.25em;
    text-align: center;
  }

  h1.text-title {
    font-family: "Playfair Display", "Garamond", serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.5em;
    padding-bottom: 1.5em;
  }

  .introduction {
    margin-bottom: 0rem;
  }

  .pub-datetime, .byline {
    text-align: center;
  }

  span.post-meta {
    padding-right: 5pt;
  }

  .pub-datetime, .byline, span.post-meta, .publication-date {
    font-family: "Cutive Mono", "Courier", monospace;
    font-size: 0.9rem !important;
    font-style: normal;
    color: var(--demure-color);
  }

  hr {
    border-top: 1px solid var(--demure-color);
    border-bottom: 0px solid var(--demure-color);
  }


  .introduction img {
    display: block;
    margin-left: auto;
    margin-right: auto;
  }

  .post-body img {
    cursor: zoom-in;
    transition: opacity 0.2s;
  }

  .post-body img:hover {
    opacity: 0.75;
  }

  .img-container {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 2rem;
    padding: 2.5rem;
  }

  .post-body p:has(img) {
    margin: 2rem auto 2rem auto;
    font-style: italic;
    font-size: 80%;
    color: var(--demure-color);
  }



  #lightbox {
    display: none;
    position: fixed;
    z-index: 99;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    cursor: zoom-out;
  }

  #lightbox.open {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #lightbox-img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    animation: ZoomIn 0.2s ease-in-out;
  }

  @keyframes ZoomIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }



  .post-body {
    counter-reset: h2-counter;
  }

  .post-body h2 {
    counter-increment: h2-counter;
    position: relative;
  }

  .post-body h2::before {
    content: counter(h2-counter, lower-roman) ". ";
    margin-right: 5pt;
  }



  .masthead {
    padding: 2em 0em 2em 0em;
    border-bottom: 1px solid var(--theme-color);
    background-color: var(--masthead-color);
  }

  .masthead-title {
    font-family: "Playfair Display", "Garamond", serif !important;
    font-size: 2em;
    font-style: italic;
    font-weight: 900;
    line-height: 0.8em;
    letter-spacing: -2pt;
  }

  .masthead-title a {
    transition: 1s;
  }

  .masthead-title a:hover {
    transition: 0.5s;
    color: var(--fg-color);
    text-decoration: none;
  }

  .masthead-title small {
    font-family: "Gelasio", serif;
    font-style: normal;
    letter-spacing: 1.2pt;
    display: inline-block;
    visibility: visible;
  }



  .sidebar {
    font-family: "Helvetica Neue", "Inter", sans-serif;
    font-size: 0.9rem;
		background-color: var(--theme-color) !important;
    width: 40%;
    left: -40%;
    transition: all 0.8s ease-in-out;
  }

  .sidebar a {
    color: var(--comp-color);
  }

  #sidebar-checkbox:checked~.sidebar, #sidebar-checkbox:checked~.wrap,
  #sidebar-checkbox:checked~.sidebar-toggle {
    transform: translateX(40vw);
  }

  .wrap, .sidebar-toggle {
    transition: all 0.8s ease-in-out;
  }

  .sidebar-toggle {
    top: 2.5rem;
    padding: 15pt 10pt 10pt 10pt;
    background-color: var(--bg-color);
    color: var(--theme-color);
  }

  .sidebar-toggle:before {
    display: inline-block;
    width: 2rem;
    height: 1rem;
    content: "";
    background-image: -webkit-linear-gradient(to bottom,var(--theme-color),var(--theme-color) 20%,var(--bg-color) 20%,var(--bg-color) 40%,var(--theme-color) 40%,var(--theme-color) 60%,var(--bg-color) 60%,var(--bg-color) 80%,var(--theme-color) 80%,var(--theme-color) 100%);
    background-image: -moz-linear-gradient(to bottom,var(--theme-color),var(--theme-color) 20%,var(--bg-color) 20%,var(--bg-color) 40%,var(--theme-color) 40%,var(--theme-color) 60%,var(--bg-color) 60%,var(--bg-color) 80%,var(--theme-color) 80%,var(--theme-color) 100%);
    background-image: -ms-linear-gradient(to bottom,var(--theme-color),var(--theme-color) 20%,var(--bg-color) 20%,var(--bg-color) 40%,var(--theme-color) 40%,var(--theme-color) 60%,var(--bg-color) 60%,var(--bg-color) 80%,var(--theme-color) 80%,var(--theme-color) 100%);
    background-image: linear-gradient(to bottom,var(--theme-color),var(--theme-color) 20%,var(--bg-color) 20%,var(--bg-color) 40%,var(--theme-color) 40%,var(--theme-color) 60%,var(--bg-color) 60%,var(--bg-color) 80%,var(--theme-color) 80%,var(--theme-color) 100%);
  }

  .sidebar-toggle:active:before, #sidebar-checkbox:focus~.sidebar-toggle:before, #sidebar-checkbox:checked~.sidebar-toggle:before {
    background-image: -webkit-linear-gradient(to bottom,var(--comp-color),var(--comp-color) 20%,#555 20%,#555 40%,var(--comp-color) 40%,var(--comp-color) 60%,#555 60%,#555 80%,var(--comp-color) 80%,var(--comp-color) 100%);
    background-image: -moz-linear-gradient(to bottom,var(--comp-color),var(--comp-color) 20%,#555 20%,#555 40%,var(--comp-color) 40%,var(--comp-color) 60%,#555 60%,#555 80%,var(--comp-color) 80%,var(--comp-color) 100%);
    background-image: -ms-linear-gradient(to bottom,var(--comp-color),var(--comp-color) 20%,#555 20%,#555 40%,var(--comp-color) 40%,var(--comp-color) 60%,#555 60%,#555 80%,var(--comp-color) 80%,var(--comp-color) 100%);
    background-image: linear-gradient(to bottom,var(--comp-color),var(--comp-color) 20%,#555 20%,#555 40%,var(--comp-color) 40%,var(--comp-color) 60%,#555 60%,#555 80%,var(--comp-color) 80%,var(--comp-color) 100%);
  }
  .sidebar-toggle:active, #sidebar-checkbox:focus~.sidebar-toggle,
  #sidebar-checkbox:checked~.sidebar-toggle {
    color: var(--bg-color);
    background-color: var(--theme-color);
  }



  .publications-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    text-align: center;
    column-gap: 4em;
  }

  .publication-item {
    margin-bottom: 10px;
    border-bottom: 1px solid var(--demure-color);
    padding-bottom: 10px;
  }



  /* for search results */
  .post-title {
    font-family: "Marcellus SC", serif;
  }



  .form-input {
    border: 1px solid var(--theme-color);
    border-radius: .2em;
    font-family: inherit;
    font-size: 1.25em;
    color: #000;
    background-color: var(--comp-color);
    width: 100%;
    padding: .5em;
    -webkit-transition: all .15s ease-in-out;
    -moz-transition: all .15s ease-in-out;
    -ms-transition: all .15s ease-in-out;
    -o-transition: all .15s ease-in-out;
    transition: all .15s ease-in-out;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
  }



  table {
    margin: 2em 0 2em 0;
    border: 0px;
    border-bottom: 2px solid var(--theme-color);
  }

  th {
    font-family: "";
    background-color: var(--theme-color);
    color: var(--bg-color);
  }


  td, th {
    padding: .25rem .5rem;
    border: 0px solid #e5e5e5;
  }

  tbody tr:nth-child(odd) td, tbody tr:nth-child(odd) th {
    background-color: var(--bg-color);
  }


  ul {
    list-style: square;
  }

  li::marker {
    color: var(--demure-color);
  }



  .footnotes {
    margin-top: 4em;
    border-top: 1px solid var(--demure-color);
    padding-top: 4em;
  }



  .motif {
    text-align: center;
    font-family: "Noto Sans Symbols 2", serif;
    font-weight: 400;
    font-size: 2em;
    color: var(--theme-color);
  }
